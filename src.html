<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DateNight" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a0a06" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231a0a06'/><text y='.9em' font-size='75' x='12'>🔥</text></svg>" />
  <title>DateNight ❤️‍🔥</title>

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel standalone for JSX (dev only - removed in build) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      /* THE fix: when viewport-fit=cover moves document up, this fills the gap at bottom */
      min-height: calc(100% + env(safe-area-inset-top));
      background: #1a0a06;
    }

    body {
      /* Match html min-height so the gap is covered */
      min-height: calc(100% + env(safe-area-inset-top));
      overflow: hidden;
      background: #1a0a06;
      overscroll-behavior: none;
    }

    #root {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      align-items: stretch;
      overflow: hidden;
      background: #1a0a06;
    }

    /* ── App shell: fills #root exactly, with safe-area padding inside ── */
    .app-shell {
      width: 100%;
      max-width: 430px;
      height: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      background: #1a0a06;
    }

    /* ── Scrollable screen area (above bottom nav) ── */
    .screen-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: scroll;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
      will-change: scroll-position;
    }
    .screen-scroll * {
      touch-action: pan-y;
    }

    /* Prevent input zoom on iOS */
    input, textarea, select {
      font-size: 16px !important;
    }

    /* Smooth iOS scrolling */
    * {
      -webkit-overflow-scrolling: touch;
    }

    /* Hide scrollbars but keep scrolling */
    ::-webkit-scrollbar {
      display: none;
    }

    /* Prevent text selection on buttons */
    button {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }


    /* Dark mode via CSS variables */
    :root {
      --cream: #f2e8d8; --warmBg: #e8d5be; --card: #fdf0e0; --border: #dfc9b0;
      --gold: #c9974a; --goldL: #e8c98a; --rose: #c4716a; --roseL: #e8a89e;
      --brown: #5c3d2e; --brownL: #8b6355; --text: #2d1f17; --textS: #7a5c4e; --textX: #b09080;
      --shadow: rgba(92,61,46,0.10); --shadowM: rgba(92,61,46,0.16);
      --header1: #3d1c0e; --header2: #6b3020;
    }
    body.dark {
      --cream: #0f0a07; --warmBg: #1a0f09; --card: #1f1410; --border: #3a2518;
      --gold: #e8c98a; --goldL: #f5e0b0; --rose: #e8a89e; --roseL: #f0c4bc;
      --brown: #e8c9a8; --brownL: #d4aa88; --text: #f0e6d8; --textS: #c4a882; --textX: #8a6e55;
      --shadow: rgba(0,0,0,0.35); --shadowM: rgba(0,0,0,0.50);
      --header1: #0a0604; --header2: #1a0e08;
    }
    /* Animations */
    @keyframes splashFade {
      to { opacity: 0; pointer-events: none; }
    }
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.25); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0% { background-position: -200px 0; }
      100% { background-position: calc(200px + 100%) 0; }
    }
  

#dice-game-root{
  --pink:#e8417a;--pink-light:#ff6fa8;--pink-glow:rgba(232,65,122,0.35);
  --gold:#c9a84c;--gold-light:#f0cd7a;
  --bg:#0d0a10;--surface:#17121c;--surface2:#211929;
  --text:#f0e8f5;--text-muted:#8a7a9a;--border:rgba(232,65,122,0.2);
  font-family:'DM Sans',sans-serif;
  background:var(--bg);color:var(--text);
  overflow-x:hidden;
  position:relative;direction:rtl;
  display:flex;flex-direction:column;flex:1;min-height:0;
}
#dice-game-root *{box-sizing:border-box;margin:0;padding:0}
#dice-game-root .bg-ambiance{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(232,65,122,0.12) 0%,transparent 70%),radial-gradient(ellipse 40% 30% at 80% 100%,rgba(201,168,76,0.08) 0%,transparent 60%)}
#dice-game-root #dg-main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:0 20px 40px;flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;box-sizing:border-box}
#dice-game-root .header{text-align:center;padding:40px 0 10px}
#dice-game-root .header-subtitle{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:8px}
#dice-game-root .header-title{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;background:linear-gradient(135deg,var(--pink-light),var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;direction:ltr}
#dice-game-root .counter-wrap{margin:18px 0 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
#dice-game-root .counter-pill{background:var(--surface2);border:1px solid var(--border);border-radius:50px;padding:8px 18px;font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:8px}
#dice-game-root .counter-pill .num{color:var(--pink-light);font-weight:700;font-size:15px}
#dice-game-root .btn-history{background:transparent;border:1px solid var(--border);border-radius:50px;padding:8px 16px;font-size:12px;color:var(--gold);cursor:pointer;transition:all .2s;font-family:'DM Sans'}
#dice-game-root .btn-history:hover{background:rgba(201,168,76,0.1);border-color:var(--gold)}
#dice-game-root .dice-scene{perspective:600px;margin:30px 0 20px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center}
#dice-game-root .dice-wrap{width:140px;height:140px;transform-style:preserve-3d;position:relative;transition:transform 1.2s cubic-bezier(.36,.07,.19,.97)}
#dice-game-root .dice-face{position:absolute;width:140px;height:140px;border-radius:22px;background:linear-gradient(135deg,#c8326a 0%,#a01d52 50%,#c8326a 100%);border:2px solid rgba(255,130,170,0.4);box-shadow:inset 0 0 30px rgba(0,0,0,0.3),0 0 20px var(--pink-glow);display:flex;align-items:center;justify-content:center}
#dice-game-root .face-front{transform:translateZ(70px)}
#dice-game-root .face-back{transform:rotateY(180deg) translateZ(70px)}
#dice-game-root .face-right{transform:rotateY(90deg) translateZ(70px)}
#dice-game-root .face-left{transform:rotateY(-90deg) translateZ(70px)}
#dice-game-root .face-top{transform:rotateX(90deg) translateZ(70px)}
#dice-game-root .face-bottom{transform:rotateX(-90deg) translateZ(70px)}
#dice-game-root .face-icon{font-size:3.5rem;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5))}
#dice-game-root .dice-glow{position:absolute;width:160px;height:30px;background:radial-gradient(ellipse,var(--pink-glow) 0%,transparent 70%);bottom:-20px;left:-10px;pointer-events:none}
#dice-game-root .btn-roll{background:linear-gradient(135deg,var(--pink) 0%,#b02060 100%);color:white;border:none;border-radius:50px;padding:16px 44px;font-size:16px;font-weight:600;font-family:'DM Sans';cursor:pointer;box-shadow:0 4px 20px var(--pink-glow);transition:all .2s;margin-top:10px;display:flex;align-items:center;gap:10px}
#dice-game-root .btn-roll:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--pink-glow)}
#dice-game-root .btn-roll:disabled{opacity:.5;cursor:not-allowed;transform:none}
#dice-game-root .remaining-badge{margin-top:20px;font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px}
#dice-game-root .remaining-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--pink-light);animation:dg-pulse 2s infinite}
@keyframes dg-pulse{0%,100%{opacity:1}50%{opacity:.3}}
#dice-game-root .pose-picker{display:flex;gap:8px;margin-top:14px;align-items:center}
#dice-game-root .pose-picker input{width:80px;background:var(--surface2);border:1px solid var(--border);border-radius:50px;padding:9px 14px;font-family:'DM Sans';font-size:13px;color:var(--text);text-align:center;outline:none;transition:border-color .2s}
#dice-game-root .pose-picker input:focus{border-color:var(--pink)}
#dice-game-root .pose-picker input::placeholder{color:var(--text-muted)}
#dice-game-root .pose-picker-btn{background:var(--surface2);border:1px solid var(--border);border-radius:50px;padding:9px 18px;font-family:'DM Sans';font-size:13px;color:var(--gold);cursor:pointer;transition:all .2s}
#dice-game-root .pose-picker-btn:hover{background:rgba(201,168,76,0.1);border-color:var(--gold)}
#dice-game-root #dg-pose-overlay{display:none;position:absolute;inset:0;z-index:100;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);align-items:flex-start;justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
#dice-game-root #dg-pose-overlay.active{display:flex}
#dice-game-root .pose-modal{background:var(--surface);width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column;animation:dg-slideUp .4s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes dg-slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
#dice-game-root .canvas-wrap{width:100%;background:#111;position:relative;overflow:hidden;min-height:280px;display:flex;align-items:center;justify-content:center}
#dice-game-root #dg-canvas{width:100%;height:auto;display:block}
#dice-game-root .canvas-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#111;flex-direction:column;gap:12px}
#dice-game-root .spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--surface2);border-top-color:var(--pink);animation:dg-spin .8s linear infinite}
@keyframes dg-spin{to{transform:rotate(360deg)}}
#dice-game-root .pose-num-badge{position:absolute;top:14px;right:14px;background:rgba(13,10,16,0.75);backdrop-filter:blur(4px);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--gold);font-weight:600}
#dice-game-root .btn-close-modal{position:absolute;top:14px;left:14px;background:rgba(13,10,16,0.7);backdrop-filter:blur(4px);border:1px solid var(--border);color:var(--text-muted);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:5;font-family:'DM Sans'}
#dice-game-root .btn-close-modal:hover{color:var(--text);border-color:var(--pink)}
#dice-game-root .pose-info{padding:22px 22px 0;direction:rtl;text-align:right}
#dice-game-root .pose-name{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;color:var(--text);line-height:1.2;margin-bottom:14px;direction:ltr;text-align:left}
#dice-game-root .info-block{background:var(--surface2);border-radius:12px;padding:14px 16px;margin-bottom:10px;border-right:3px solid var(--pink);direction:rtl;text-align:right}
#dice-game-root .info-block-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--pink-light);font-weight:600;margin-bottom:8px}
#dice-game-root .pose-desc-text{font-size:14px;line-height:1.7;color:rgba(240,232,245,0.85);direction:ltr;text-align:left}
#dice-game-root .rating-section{padding:0 22px;margin-top:4px;direction:rtl;text-align:right}
#dice-game-root .section-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;font-weight:500}
#dice-game-root .stars-row{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:6px;margin-bottom:14px}
#dice-game-root .star-btn{font-size:26px;cursor:pointer;background:none;border:none;transition:transform .15s,filter .15s;filter:grayscale(1) brightness(.5);line-height:1}
#dice-game-root .star-btn.active{filter:none}
#dice-game-root .star-btn:hover{transform:scale(1.25);filter:none}
#dice-game-root .notes-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-family:'DM Sans';font-size:14px;color:var(--text);resize:none;height:70px;direction:rtl;text-align:right;transition:border-color .2s}
#dice-game-root .notes-input::placeholder{color:var(--text-muted)}
#dice-game-root .notes-input:focus{outline:none;border-color:var(--pink)}
#dice-game-root .try-again-row{display:flex;gap:10px;margin-top:14px}
#dice-game-root .toggle-btn{flex:1;padding:11px 8px;border-radius:10px;font-family:'DM Sans';font-size:14px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:transparent;color:var(--text-muted);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
#dice-game-root .toggle-btn:hover{border-color:var(--pink);color:var(--text)}
#dice-game-root .toggle-btn.selected-yes{background:rgba(232,65,122,0.15);border-color:var(--pink);color:var(--pink-light)}
#dice-game-root .toggle-btn.selected-no{background:rgba(100,100,120,0.2);border-color:#555;color:#aaa}
#dice-game-root .save-section{padding:16px 22px 30px;display:flex;flex-direction:column;gap:10px}
#dice-game-root .btn-save{width:100%;background:linear-gradient(135deg,var(--pink),#b02060);color:white;border:none;border-radius:50px;padding:15px;font-size:15px;font-weight:600;font-family:'DM Sans';cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
#dice-game-root .btn-save:disabled{background:var(--surface2);color:var(--text-muted);cursor:not-allowed}
#dice-game-root .btn-save:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 6px 20px var(--pink-glow)}
#dice-game-root .btn-skip{width:100%;background:transparent;color:var(--text-muted);border:1px solid var(--border);border-radius:50px;padding:12px;font-size:14px;font-family:'DM Sans';cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
#dice-game-root .btn-skip:hover{border-color:var(--gold);color:var(--gold)}
#dice-game-root #dg-history-overlay{display:none;position:absolute;inset:0;z-index:200;background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);align-items:flex-start;justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
#dice-game-root #dg-history-overlay.active{display:flex}
#dice-game-root .history-modal{width:100%;max-width:560px;min-height:100dvh;background:var(--surface);animation:dg-slideUp .35s ease;padding:0 0 40px}
#dice-game-root .history-header{padding:30px 22px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);direction:rtl}
#dice-game-root .history-title{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,var(--pink-light),var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#dice-game-root .btn-close-history{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:'DM Sans';flex-shrink:0}
#dice-game-root .btn-close-history:hover{border-color:var(--pink);color:var(--text)}
#dice-game-root .history-table{width:100%;border-collapse:collapse;table-layout:fixed;direction:rtl}
#dice-game-root .history-table th{padding:12px 10px;font-size:11px;letter-spacing:1.5px;font-weight:600;text-transform:uppercase;border-bottom:2px solid var(--border)}
#dice-game-root .history-table th.col-yes{color:var(--pink-light);text-align:right;border-left:1px solid var(--border)}
#dice-game-root .history-table th.col-no{color:var(--text-muted);text-align:right}
#dice-game-root .history-table td{padding:5px 6px;vertical-align:top;border-bottom:1px solid rgba(232,65,122,0.06)}
#dice-game-root .history-table td.col-yes{border-left:1px solid var(--border)}
#dice-game-root .hc-card{background:var(--surface2);border-radius:10px;padding:10px 12px;cursor:pointer;transition:background .15s;direction:rtl;text-align:right}
#dice-game-root .hc-card:hover{background:#2d2238}
#dice-game-root .hc-name{font-weight:600;font-size:13px;color:var(--text);margin-bottom:3px}
#dice-game-root .hc-meta{font-size:11px;color:var(--text-muted);display:flex;gap:6px;align-items:center}
#dice-game-root .hc-stars{color:var(--gold);font-size:11px}
#dice-game-root .hc-note{font-size:11px;color:var(--text-muted);font-style:italic;margin-top:3px}
#dice-game-root .hc-delete{background:none;border:1px solid rgba(255,80,80,0.2);color:var(--text-muted);font-size:10px;cursor:pointer;padding:3px 8px;border-radius:5px;transition:all .2s;margin-top:6px;display:inline-block;font-family:'DM Sans'}
#dice-game-root .hc-delete:hover{color:#ff6060;background:rgba(255,80,80,0.1)}
#dice-game-root .history-empty{padding:40px 22px;text-align:center;color:var(--text-muted);font-size:14px}
#dice-game-root .sexy-label{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:1001;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;animation:dg-sexyPop 2.2s ease forwards}
#dice-game-root .sexy-text{font-size:4rem;font-weight:900;font-family:'Playfair Display',serif;letter-spacing:8px;background:linear-gradient(135deg,#ff4488,#ff9900,#ff4488);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 20px rgba(255,68,136,0.9)) drop-shadow(0 0 40px rgba(255,68,136,0.6))}
#dice-game-root .sexy-flame{font-size:2.8rem;text-align:center;line-height:1}
@keyframes dg-sexyPop{0%{transform:translate(-50%,-50%) scale(0) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.35) rotate(3deg);opacity:1}40%{transform:translate(-50%,-50%) scale(1) rotate(0deg);opacity:1}75%{transform:translate(-50%,-50%) scale(1.05);opacity:1}100%{transform:translate(-50%,-50%) scale(0.5) rotate(5deg);opacity:0}}
@keyframes dg-fireworkBurst{0%{transform:translate(0,0) scale(0.3);opacity:1}60%{opacity:1}100%{transform:translate(calc(var(--ex) - 50vw),calc(var(--ey) - 45vh)) scale(1.1);opacity:0}}
#dice-game-root #dg-finish{display:none;position:fixed;inset:0;z-index:300;background:var(--bg);align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:40px;direction:rtl}
#dice-game-root #dg-finish.active{display:flex}
#dice-game-root .finish-emoji{font-size:4rem;margin-bottom:20px}
#dice-game-root .finish-title{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;background:linear-gradient(135deg,var(--pink-light),var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px}
#dice-game-root .finish-sub{color:var(--text-muted);font-size:15px;line-height:1.6}
#dice-game-root .btn-reset{margin-top:30px;background:linear-gradient(135deg,var(--pink),#b02060);color:white;border:none;border-radius:50px;padding:14px 36px;font-size:15px;font-weight:600;font-family:'DM Sans';cursor:pointer;box-shadow:0 4px 20px var(--pink-glow)}


/* ── Positions Book overlay ── */
/* Fix 4: box-sizing !important on all overlay children */
#positions-book-overlay * {
  box-sizing: border-box !important;
}
/* Fix 1: overlay is always a flex column at 100dvh — hidden via visibility, shown via .active */
#positions-book-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 9999;
  background: #0d0a10;
  touch-action: pan-y;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  visibility: hidden;
  pointer-events: none;
  /* Push content below status bar */
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}
#positions-book-overlay.active {
  visibility: visible;
  pointer-events: auto;
}

u05d4 \u05e9\u05d5\u05d1!</button>\n        <button class=\"toggle-btn\" id=\"dg-btn-no\" onclick=\"DiceGameApp.setTryAgain(false)\">\u2717 \u05dc\u05d0 \u05de\u05de\u05e9</button>\n      </div>\n    </div>\n    <div class=\"save-section\">\n      <button class=\"btn-save\" id=\"dg-btn-save\" disabled onclick=\"DiceGameApp.savePose()\">\ud83d\udcbe \u05e9\u05de\u05d5\u05e8 \u05d5\u05e2\u05d1\u05d5\u05e8 \u05d4\u05dc\u05d0\u05d4</button>\n      <button class=\"btn-skip\" onclick=\"DiceGameApp.skipPose()\">\ud83c\udfb2 \u05ea\u05e0\u05d5\u05d7\u05d4 \u05d0\u05d7\u05e8\u05ea</button>\n    </div>\n  </div>\n</div>\n\n<div id=\"dg-history-overlay\">\n  <div class=\"history-modal\">\n    <div class=\"history-header\">\n      <div class=\"history-title\">\ud83d\udccb \u05d4\u05d9\u05e1\u05d8\u05d5\u05e8\u05d9\u05d4</div>\n      <button class=\"btn-close-history\" onclick=\"DiceGameApp.closeHistory()\">\u2715</button>\n    </div>\n    <div id=\"dg-history-content\"></div>\n  </div>\n</div>\n\n<div id=\"dg-finish\">\n  <div class=\"finish-emoji\">\ud83c\udfc6</div>\n  <div class=\"finish-title\">\u05e2\u05e9\u05d9\u05ea\u05dd \u05d0\u05ea \u05db\u05d5\u05dc\u05df!</div>\n  <div class=\"finish-sub\">\u05db\u05dc 365 \u05d4\u05ea\u05e0\u05d5\u05d7\u05d5\u05ea \u05d1\u05d5\u05e6\u05e2\u05d5.<br>\u05de\u05d3\u05d4\u05d9\u05dd! \u05d0\u05ea\u05dd \u05de\u05e7\u05e6\u05d5\u05e2\u05d9\u05dd \u05d0\u05de\u05d9\u05ea\u05d9\u05d9\u05dd \ud83d\udd25</div>\n  <button class=\"btn-reset\" onclick=\"DiceGameApp.resetAll()\">\ud83d\udd04 \u05d4\u05ea\u05d7\u05dc \u05de\u05d7\u05d3\u05e9</button>\n</div>\n";

window.DiceGameApp = (function() {
  'use strict';

  /* ── private state ─────────────────────────────────────────────── */
  var _root = null;
  var pdfDoc = null;
  var currentPose = null, currentRating = 0, currentTryAgain = null;
  var isRolling = false, hoverRating = 0;
  var diceTransform = 'rotateX(0deg) rotateY(0deg)';

  /* ── helpers ───────────────────────────────────────────────────── */
  function $(id){ return _root.querySelector('#'+id); }
  function getHistory(){ try{ return JSON.parse(localStorage.getItem('poses_history')||'{}'); }catch(e){ return {}; } }
  function saveHistory(h){ localStorage.setItem('poses_history', JSON.stringify(h)); }
  function getAvailable(){ var d=getHistory(); return POSES_DATA.filter(function(p){ return !d[p.num]; }); }

  /* ── PDF ───────────────────────────────────────────────────────── */
  async function loadPDF(){
    if(pdfDoc) return;
    pdfDoc = await pdfjsLib.getDocument({url:'./positions.pdf'}).promise;
  }
  async function renderPage(idx){
    var canvas = $('dg-canvas');
    var loading = $('dg-canvas-loading');
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    canvas.width=0; canvas.height=0;
    loading.style.display='flex';
    canvas.style.display='none';
    await loadPDF();
    var page = await pdfDoc.getPage(idx+1);
    var vp = page.getViewport({scale:2});
    canvas.width=vp.width; canvas.height=vp.height;
    await page.render({canvasContext:ctx, viewport:vp}).promise;
    loading.style.display='none';
    canvas.style.display='block';
  }

  /* ── UI helpers ────────────────────────────────────────────────── */
  function updateUI(){
    var d=getHistory(), n=Object.keys(d).length;
    $('dg-done').textContent = n;
    $('dg-remaining').textContent = (365-n)+' \u05ea\u05e0\u05d5\u05d7\u05d5\u05ea \u05d6\u05de\u05d9\u05e0\u05d5\u05ea';
  }
  function updateStars(selected, hover){
    var eff = hover>0 ? hover : selected;
    _root.querySelectorAll('.star-btn').forEach(function(b){
      b.classList.toggle('active', parseInt(b.dataset.val) <= eff);
    });
  }

  /* ── dice ──────────────────────────────────────────────────────── */
  function rollDice(){
    if(isRolling) return;
    var avail = getAvailable();
    if(!avail.length){ $('dg-finish').classList.add('active'); return; }
    isRolling = true;
    var dice = $('dg-dice');
    var rx = (4+Math.floor(Math.random()*5))*360 + Math.floor(Math.random()*4)*90;
    var ry = (4+Math.floor(Math.random()*5))*360 + Math.floor(Math.random()*4)*90;
    dice.style.transition = 'none';
    dice.style.transform = diceTransform;
    void dice.offsetWidth;
    dice.style.transition = 'transform 1.2s cubic-bezier(.36,.07,.19,.97)';
    diceTransform = 'rotateX('+rx+'deg) rotateY('+ry+'deg)';
    dice.style.transform = diceTransform;
    $('dg-btn-roll').disabled = true;
    setTimeout(function(){
      if(navigator.vibrate) navigator.vibrate([30,10,20]);
      var pose = avail[Math.floor(Math.random()*avail.length)];
      openModal(pose);
      isRolling = false;
      $('dg-btn-roll').disabled = false;
    }, 1250);
  }

  /* ── modal ─────────────────────────────────────────────────────── */
  function openModal(pose){
    currentPose=pose; currentRating=0; currentTryAgain=null; hoverRating=0;
    $('dg-num-badge').textContent = '#'+pose.num;
    $('dg-pose-name').textContent = pose.name;
    $('dg-notes').value = '';
    $('dg-description').textContent = pose.description;
    updateStars(0,0);
    $('dg-btn-yes').className = 'toggle-btn';
    $('dg-btn-no').className = 'toggle-btn';
    $('dg-btn-save').disabled = true;
    $('dg-pose-overlay').classList.add('active');
    document.body.style.overflow = 'hidden';
    renderPage(pose.page_index);
  }
  function closeModal(){
    $('dg-pose-overlay').classList.remove('active');
    document.body.style.overflow = '';
    currentPose = null;
  }
  function skipPose(){
    var avail = getAvailable().filter(function(p){ return !currentPose||p.num!==currentPose.num; });
    if(!avail.length) return;
    openModal(avail[Math.floor(Math.random()*avail.length)]);
  }
  function goToPose(){
    var val = parseInt($('dg-picker').value);
    if(isNaN(val)||val<1||val>365){ alert('\u05d1\u05d7\u05e8 \u05de\u05e1\u05e4\u05e8 \u05d1\u05d9\u05df 1 \u05dc-365'); return; }
    var pose = POSES_DATA.find(function(p){ return p.num===val; });
    if(!pose){ alert('\u05ea\u05e0\u05d5\u05d7\u05d4 #'+val+' \u05dc\u05d0 \u05e0\u05de\u05e6\u05d0\u05d4'); return; }
    $('dg-picker').value = '';
    openModal(pose);
  }

  /* ── rating ────────────────────────────────────────────────────── */
  function setTryAgain(val){
    currentTryAgain = val;
    $('dg-btn-yes').className = val ? 'toggle-btn selected-yes' : 'toggle-btn';
    $('dg-btn-no').className  = !val ? 'toggle-btn selected-no'  : 'toggle-btn';
    $('dg-btn-save').disabled = false;
  }
  function savePose(){
    if(!currentPose||currentTryAgain===null) return;
    var h = getHistory();
    h[currentPose.num] = {
      num:currentPose.num, name:currentPose.name, rating:currentRating,
      note:$('dg-notes').value.trim(), tryAgain:currentTryAgain,
      date:new Date().toLocaleDateString('he-IL')
    };
    saveHistory(h); updateUI(); triggerCelebration();
    setTimeout(closeModal, 1800);
  }

  /* ── celebration ───────────────────────────────────────────────── */
  function triggerCelebration(){
    if(navigator.vibrate) navigator.vibrate([40,20,40,20,80]);
    var lbl = document.createElement('div');
    lbl.className = 'sexy-label';
    lbl.innerHTML = '<div class="sexy-text">SEXY</div><div class="sexy-flame">\ud83d\udd25</div>';
    _root.appendChild(lbl);
    setTimeout(function(){ if(lbl.parentNode) lbl.parentNode.removeChild(lbl); }, 2200);
    var emojis = ['\ud83d\udc8b','\ud83d\udd25','\u2764\ufe0f'];
    for(var i=0;i<18;i++){
      (function(idx){
        setTimeout(function(){
          var el = document.createElement('div');
          el.className = 'firework-emoji';
          el.textContent = emojis[idx%3];
          var angle = Math.random()*Math.PI*2;
          var dist  = 30+Math.random()*35;
          var endX  = 50+Math.cos(angle)*dist;
          var endY  = 45+Math.sin(angle)*dist;
          el.style.cssText = 'position:fixed;z-index:999;pointer-events:none;'
            +'font-size:'+(1.6+Math.random()*1.4)+'rem;'
            +'left:50vw;top:45vh;'
            +'--ex:'+endX+'vw;--ey:'+endY+'vh;'
            +'animation:dg-fireworkBurst '+(0.7+Math.random()*0.5)+'s ease-out forwards;';
          _root.appendChild(el);
          setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 1400);
        }, idx*60);
      })(i);
    }
  }

  /* ── history ───────────────────────────────────────────────────── */
  function openHistory(){
    var h=getHistory(), entries=Object.values(h);
    var yes=entries.filter(function(e){ return e.tryAgain; }).sort(function(a,b){ return b.rating-a.rating; });
    var no =entries.filter(function(e){ return !e.tryAgain; }).sort(function(a,b){ return b.rating-a.rating; });
    var hc = $('dg-history-content');
    if(!entries.length){
      hc.innerHTML = '<div class="history-empty">\u05e2\u05d3\u05d9\u05d9\u05df \u05dc\u05d0 \u05d3\u05d5\u05e8\u05d2\u05d4 \u05d0\u05e3 \u05ea\u05e0\u05d5\u05d7\u05d4</div>';
    } else {
      var maxR = Math.max(yes.length, no.length);
      var html = '<table class="history-table"><thead><tr>'
        +'<th class="col-yes">\ud83d\udc96 \u05e0\u05e0\u05e1\u05d4 \u05e9\u05d5\u05d1 ('+yes.length+')</th>'
        +'<th class="col-no">\u2717 \u05dc\u05d0 \u05dc\u05d4\u05d9\u05d8 ('+no.length+')</th>'
        +'</tr></thead><tbody>';
      for(var r=0;r<maxR;r++){
        html += '<tr>'
          +'<td class="col-yes">'+(yes[r]?renderCard(yes[r]):'')+'</td>'
          +'<td class="col-no">'+(no[r]?renderCard(no[r]):'')+'</td>'
          +'</tr>';
      }
      html += '</tbody></table>';
      hc.innerHTML = html;
      hc.onclick = function(ev){
        var del  = ev.target.closest('.hc-delete');
        if(del){ ev.stopPropagation(); deleteRating(parseInt(del.dataset.num)); return; }
        var card = ev.target.closest('.hc-card');
        if(card) openPoseFromHistory(parseInt(card.dataset.num));
      };
    }
    $('dg-history-overlay').classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function renderCard(e){
    var stars = e.rating>0 ? '\u2b50'.repeat(e.rating) : '';
    var note  = e.note ? '<div class="hc-note">'+e.note+'</div>' : '';
    return '<div class="hc-card" data-num="'+e.num+'">'
      +'<div class="hc-name">'+e.name+'</div>'
      +'<div class="hc-meta"><span class="hc-stars">'+stars+'</span><span>#'+e.num+'</span></div>'
      +note
      +'<button class="hc-delete" data-num="'+e.num+'">\ud83d\uddd1\ufe0f \u05de\u05d7\u05e7</button>'
      +'</div>';
  }
  function openPoseFromHistory(num){
    closeHistory();
    var pose = POSES_DATA.find(function(p){ return p.num===num; });
    if(pose) openModal(pose);
  }
  function deleteRating(num){
    if(!confirm('\u05dc\u05de\u05d7\u05d5\u05e7 \u05d0\u05ea \u05d4\u05d3\u05d9\u05e8\u05d5\u05d2 \u05e9\u05dc \u05ea\u05e0\u05d5\u05d7\u05d4 #'+num+'?')) return;
    var h=getHistory(); delete h[num]; saveHistory(h); updateUI(); openHistory();
  }
  function closeHistory(){
    $('dg-history-overlay').classList.remove('active');
    document.body.style.overflow = '';
  }
  function resetAll(){
    if(confirm('\u05dc\u05de\u05d7\u05d5\u05e7 \u05d0\u05ea \u05db\u05dc \u05d4\u05d4\u05d9\u05e1\u05d8\u05d5\u05e8\u05d9\u05d4?')){
      localStorage.removeItem('poses_history');
      $('dg-finish').classList.remove('active');
      updateUI();
    }
  }

  /* ── init ──────────────────────────────────────────────────────── */
  function init(containerId){
    _root = document.getElementById(containerId);
    if(!_root){ console.error('DiceGameApp: container #'+containerId+' not found'); return; }
    _root.id = 'dice-game-root';  /* apply CSS namespace */
    _root.innerHTML = DICE_HTML_TEMPLATE;
    /* star hover via delegation */
    var starsRow = $('dg-stars');
    starsRow.addEventListener('mouseover', function(ev){
      var b=ev.target.closest('.star-btn'); if(!b) return;
      hoverRating=parseInt(b.dataset.val); updateStars(currentRating,hoverRating);
    });
    starsRow.addEventListener('mouseleave', function(){
      hoverRating=0; updateStars(currentRating,0);
    });
    starsRow.addEventListener('click', function(ev){
      var b=ev.target.closest('.star-btn'); if(!b) return;
      currentRating=parseInt(b.dataset.val); updateStars(currentRating,hoverRating);
    });
    updateUI();
  }

  /* ── public API ────────────────────────────────────────────────── */
  return {
    init:              init,
    rollDice:          rollDice,
    openModal:         openModal,
    closeModal:        closeModal,
    skipPose:          skipPose,
    goToPose:          goToPose,
    setTryAgain:       setTryAgain,
    savePose:          savePose,
    openHistory:       openHistory,
    closeHistory:      closeHistory,
    resetAll:          resetAll,
    deleteRating:      deleteRating,
    openPoseFromHistory: openPoseFromHistory
  };
})();

/* ── Positions Book open/close ── */
function openPositionsBook() {
  var overlay = document.getElementById('positions-book-overlay');
  overlay.classList.add('active');
  // Fix 3: lock body to prevent iOS scroll bleed-through
  document.body.classList.add('positions-open');
  document.body.style.position = 'fixed';
  document.body.style.width = '100%';
  // Init only once
  if (!window._positionsInitialized) {
    DiceGameApp.init('dice-game-root');
    window._positionsInitialized = true;
  }
}
function closePositionsBook() {
  var overlay = document.getElementById('positions-book-overlay');
  overlay.classList.remove('active');
  document.body.classList.remove('positions-open');
  document.body.style.position = '';
  document.body.style.width = '';
}
</script>

</body>
</html>
